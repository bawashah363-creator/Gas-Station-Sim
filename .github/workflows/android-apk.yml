name: Build Native Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Gas Station Simulator APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Licenses & Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle Dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck & Build Web Assets
        run: |
          npm run lint
          npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Native Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Gas-Station-Simulator.apk
          ls -lh apk-output/Gas-Station-Simulator.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gas-Station-Simulator-APK
          path: apk-output/Gas-Station-Simulator.apk
          retention-days: 30
